<!doctype html>
<!-- Imagen para compartir (1200x630). Se convierte a public/og.jpg con una captura. -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../public/fonts/fonts.css">
<style>
@font-face{font-family:"Bubblegum Sans";src:url(../public/fonts/BubblegumSans.woff)}
@font-face{font-family:"Gochi Hand";src:url(../public/fonts/GochiHand.woff)}
@font-face{font-family:"Poppins";src:url(../public/fonts/Poppins-Bold.woff);font-weight:700}
@font-face{font-family:"Poppins";src:url(../public/fonts/Poppins-Medium.woff);font-weight:500}
body{margin:0}
.og{width:1200px;height:630px;background:#ECBE48;position:relative;overflow:hidden;font-family:Poppins,sans-serif;color:#3B2216}
.izq{position:absolute;left:64px;top:70px;width:600px}
.izq img{width:560px}
.desc{font-weight:700;letter-spacing:4px;font-size:22px;margin:10px 0 0 8px}
.frase{font-family:"Gochi Hand";font-size:64px;color:#FFF6E6;text-shadow:3px 3px 0 #9A6A25;margin:34px 0 0 8px;line-height:1}
.chips{display:flex;gap:10px;margin:30px 0 0 8px;flex-wrap:wrap;width:560px}
.chips span{background:#FFF6E6;border-radius:999px;padding:8px 18px;font-weight:700;font-size:20px}
.wa{position:absolute;left:72px;bottom:46px;background:#1F9D55;color:#fff;font-weight:700;font-size:26px;border-radius:999px;padding:14px 30px;box-shadow:0 6px 0 #146b39}
.der{position:absolute;right:40px;top:40px;width:520px;height:560px}
.der img{position:absolute;height:285px}
.c1{left:10px;top:10px;transform:rotate(-8deg)}.c2{left:260px;top:0}.c3{left:0;top:270px}.c4{left:250px;top:260px;transform:rotate(6deg)}
</style></head><body>
<div class="og">
  <div class="izq">
    <img src="../public/img/logo.svg" alt="">
    <div class="desc">SNACKS DE FRUTAS Y VERDURAS</div>
    <div class="frase">¡Crujiente de verdad!</div>
    <div class="chips"><span>Jícama</span><span>Pepino</span><span>Camote</span><span>Plátano</span></div>
  </div>
  <div class="wa">11 sabores · pídelos por WhatsApp</div>
  <div class="der">
    <img class="c1" src="../public/img/crunchi/platano.webp" alt="">
    <img class="c2" src="../public/img/crunchi/jicama.webp" alt="">
    <img class="c3" src="../public/img/crunchi/camote.webp" alt="">
    <img class="c4" src="../public/img/crunchi/pepino.webp" alt="">
  </div>
</div></body></html>
