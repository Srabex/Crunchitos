<style>
:root{--tinta:#3B2216;--crema:#FFF6E6;--sombra:#9A6A25;--amarillo:#ECBE48;--wa:#1F9D55;--linea:#EADBC0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--amarillo) repeating-conic-gradient(from 0deg at 50% 0%,rgba(255,246,230,.18) 0deg 7deg,rgba(255,246,230,0) 7deg 14deg);text-align:center;padding:22px 16px 26px}
header img{width:180px;height:auto;display:block;margin:0 auto}
header h1{font-family:"Gochi Hand",cursive;font-weight:400;font-size:34px;line-height:1;color:var(--crema);text-shadow:2px 3px 0 var(--sombra);margin:10px 0 0}
main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:18px 16px 28px}
.tarjeta{position:relative;overflow:hidden;background:var(--tinta);color:var(--crema);border-radius:24px;padding:22px 22px 18px;box-shadow:0 18px 40px -22px rgba(59,34,22,.6)}
.tarjeta::before{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:#5a3a2a}
.tarjeta .banco{position:relative;font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--amarillo)}
.chip{position:absolute;right:22px;top:20px;width:44px;height:32px;border-radius:7px;background:var(--amarillo)}
.dato{position:relative;display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:12px 0;border-top:1px solid rgba(255,246,230,.15);cursor:pointer}
.dato:first-of-type{border-top:0;margin-top:6px}
.dato small{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.dato small i{font-style:normal;letter-spacing:.5px;text-transform:none;color:var(--amarillo);opacity:1}
.dato b{display:block;font-size:21px;font-weight:700;letter-spacing:1px;margin-top:2px;font-variant-numeric:tabular-nums}
.dato.ok small i{color:#7BE0A3}
.dato:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px;border-radius:8px}
.titular{position:relative;font-size:15px;margin-top:6px;opacity:.9}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;margin-top:16px;border-radius:999px;font:700 16px Poppins,sans-serif;text-decoration:none;background:var(--wa);color:#fff;box-shadow:0 4px 0 #146b39}
.btn svg{width:22px;height:22px}
.nota{font-size:13.5px;line-height:1.5;text-align:center;margin:14px 0 0;opacity:.8}
footer{text-align:center;font-size:12px;opacity:.65;padding:0 16px 18px}
footer a{color:inherit}
</style>

    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>

<script>
document.querySelectorAll("[data-copiar]").forEach(function (b) {
  b.addEventListener("click", function () {
    var v = b.getAttribute("data-copiar"), i = b.querySelector("i");
    var listo = function () { b.classList.add("ok"); i.textContent = "¡Copiado!"; setTimeout(function () { b.classList.remove("ok"); i.textContent = "Toca para copiar"; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(listo, function () { viejo(v); listo(); });
    else { viejo(v); listo(); }
  });
});
function viejo(v) { var t = document.createElement("textarea"); t.value = v; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(t); }
</script>
